services:
  formauto-sql:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
    container_name: formauto-sql
    env_file:
      - /etc/formauto/sql.env
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - formauto-sql-data:/var/opt/mssql
      - "${DEPLOY_PATH:-/home/deploy/FormAuto_Hub}/sql/backups:/var/opt/mssql/backups"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  formauto-api:
    image: ${FORMAUTO_API_IMAGE:-formauto-hub-api}:${FORMAUTO_RELEASE_TAG:-latest}
    env_file:
      - /etc/formauto/api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeysPath: /var/lib/formautohub/data-protection-keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5100:8080"
    volumes:
      - formauto-data-protection-keys:/var/lib/formautohub/data-protection-keys
    depends_on:
      formauto-sql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  formauto-web:
    image: ${FORMAUTO_WEB_IMAGE:-formauto-hub-web}:${FORMAUTO_RELEASE_TAG:-latest}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      FORMAUTO_API_BASE_URL: ${FORMAUTO_API_BASE_URL:-http://formauto-api:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-formautohub.servertun.pp.ua}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://formautohub.servertun.pp.ua}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_OAUTH_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_OAUTH_REDIRECT_URI:-}
    depends_on:
      formauto-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  formauto-sql-data:
  formauto-data-protection-keys:
